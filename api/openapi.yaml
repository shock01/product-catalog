openapi: "3.1.0"

info:
  title: Product Catalog API
  version: 1.0.0
  description: |
    REST API for the Product Catalog bounded context.

    Two sub-contexts are exposed under the `catalog` domain:
    - **catalog/product** — CRUD operations backed by PostgreSQL (via Valkey cache). Requires `catalog:product:read` or `catalog:product:write`.
    - **catalog/search** — Read-only search and listing backed by OpenSearch. Requires `catalog:search:read`.

    All mutating operations are idempotent and use optimistic locking via `If-Match` / `ETag` headers.

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            catalog:product:read: Read a single product by ID
            catalog:product:write: Create, update, and delete products
            catalog:search:read: Search and list products

  # -------------------------------------------------------------------------
  # Shared responses
  # -------------------------------------------------------------------------
  responses:
    NotFound:
      description: |
        The requested resource does not exist and has never existed at this URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_NOT_FOUND
              message: product with id 123e4567-e89b-12d3-a456-426614174000 not found

    Gone:
      description: |
        The resource previously existed but has been deleted. The ID is known
        to the system (soft-deleted record) but is no longer accessible.
        Clients should remove any cached references to this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_DELETED
              message: product with id 123e4567-e89b-12d3-a456-426614174000 has been deleted

    VersionConflict:
      description: |
        The `If-Match` ETag does not match the current resource version.
        Re-fetch the resource (GET), obtain the new ETag, and retry the mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VERSION_CONFLICT
              message: ETag mismatch — resource has been modified since last read

    Conflict:
      description: |
        The request conflicts with existing data (e.g. duplicate SKU across products).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SKU_CONFLICT
              message: variant SKU TSHIRT-S-RED already exists on another product

    BadRequest:
      description: Request body or query parameters failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: "variants: minimum 1 item required"

    UnprocessableEntity:
      description: |
        The request is structurally valid but violates a domain invariant
        (e.g. a variant references an option value code not declared in `options`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVARIANT_VIOLATION
              message: variant TSHIRT-S-RED references unknown option value code 'red'

  # -------------------------------------------------------------------------
  # Shared parameters
  # -------------------------------------------------------------------------
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Aggregate root ID (UUID) of the product.
      schema:
        type: string
        format: uuid

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Content-derived ETag of the resource, obtained from the `ETag` response
        header or `meta.etag` of a prior GET. Generated by hashing the canonical
        JSON serialisation of the resource (SHA-256, first 16 hex chars).
        Returns 412 if the resource has changed since the ETag was issued.
      schema:
        type: string
        example: '"a3f8c2d1e4b09712"'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated UUID. If a POST with this key was already processed
        within 24 h the original response is returned without re-processing.
      schema:
        type: string
        format: uuid

    LocaleParam:
      name: locale
      in: query
      required: false
      description: BCP-47 locale code used to select the translation to return (e.g. `en-GB`).
      schema:
        type: string
        example: en-GB

    ChannelParam:
      name: channel
      in: query
      required: false
      description: Channel code to filter by (e.g. `web`, `pos`).
      schema:
        type: string
        example: web

    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned by a previous response.
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return. Default 20, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- Enums ---------------------------------------------------------------

    ProductStatus:
      type: string
      enum: [draft, active, published, archived]
      description: Lifecycle status of the product.

    StockStatus:
      type: string
      enum: [IN_STOCK, LOW, OOS]
      description: |
        Textual stock availability level. The Catalog never stores exact
        quantities — those are owned by the Stock Service.

    AssetType:
      type: string
      enum: [image, video]

    AssetScope:
      type: string
      enum: [product, variant]

    # -- Localisation --------------------------------------------------------

    ProductTranslation:
      type: object
      required: [locale, title, slug]
      properties:
        locale:
          type: string
          description: BCP-47 locale code (e.g. `en-GB`, `de-DE`).
          example: en-GB
        title:
          type: string
          example: Classic T-Shirt
        slug:
          type: string
          description: URL-safe localised slug. Must be unique per locale.
          example: classic-t-shirt
        description:
          type: string
          example: A timeless wardrobe staple.
        short_description:
          type: string
          example: Everyday comfort.
        meta_title:
          type: string
          example: Classic T-Shirt | MyStore
        meta_description:
          type: string
          example: Shop the Classic T-Shirt in multiple colours and sizes.

    VariantTranslation:
      type: object
      required: [locale, title]
      properties:
        locale:
          type: string
          example: en-GB
        title:
          type: string
          example: Classic T-Shirt — S / Red
        description:
          type: string

    OptionTranslation:
      type: object
      required: [locale, name]
      properties:
        locale:
          type: string
          example: en-GB
        name:
          type: string
          description: Human-readable option name for this locale.
          example: Size

    OptionValueTranslation:
      type: object
      required: [locale, value]
      properties:
        locale:
          type: string
          example: en-GB
        value:
          type: string
          description: Human-readable option value label for this locale.
          example: Extra Large

    # -- Options -------------------------------------------------------------

    OptionValue:
      type: object
      required: [id, code, sort_order, translations]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Locale-neutral machine identifier (e.g. `xl`, `red`).
          example: xl
        sort_order:
          type: integer
        translations:
          type: array
          items:
            $ref: '#/components/schemas/OptionValueTranslation'

    Option:
      type: object
      required: [id, code, sort_order, values, translations]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Locale-neutral machine identifier (e.g. `size`, `colour`).
          example: size
        sort_order:
          type: integer
        translations:
          type: array
          items:
            $ref: '#/components/schemas/OptionTranslation'
        values:
          type: array
          items:
            $ref: '#/components/schemas/OptionValue'

    # -- Assets --------------------------------------------------------------

    Asset:
      type: object
      required: [id, url, type, scope, sort_order]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: https://cdn.example.com/tshirt-hero.jpg
        type:
          $ref: '#/components/schemas/AssetType'
        scope:
          $ref: '#/components/schemas/AssetScope'
        variant_id:
          type: string
          format: uuid
          description: Set when scope is `variant`; omitted when scope is `product`.
        sort_order:
          type: integer

    # -- Stock ---------------------------------------------------------------

    StockLevel:
      type: object
      required: [warehouse_code, level]
      properties:
        warehouse_code:
          type: string
          example: WH-LON-01
        level:
          $ref: '#/components/schemas/StockStatus'

    # -- Channel / Marketplace -----------------------------------------------

    ChannelListing:
      type: object
      required: [channel_id, enabled]
      properties:
        channel_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        price_override:
          type: number
          format: decimal
          description: Overrides the variant base price for this channel. Omit to use base price.
        currency:
          type: string
          description: ISO 4217 currency code. Required when price_override is set.
          example: GBP

    MarketplaceListing:
      type: object
      required: [marketplace_id, external_id]
      properties:
        marketplace_id:
          type: string
          format: uuid
        external_id:
          type: string
          description: The product's ID in the external marketplace system.
        feed_attributes:
          type: object
          additionalProperties: true
          description: Marketplace-specific key/value attributes for feed generation.

    # -- Variants ------------------------------------------------------------

    Variant:
      type: object
      required: [id, sku, price, currency, option_value_ids, stock_levels, translations, version]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          description: Unique identifier of this purchasable unit.
          example: TSHIRT-S-RED
        price:
          type: number
          format: decimal
          example: 19.99
        currency:
          type: string
          description: ISO 4217 currency code.
          example: GBP
        option_value_ids:
          type: array
          description: |
            IDs of the OptionValues that define this variant.
            One entry per Option defined on the product.
          items:
            type: string
            format: uuid
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        stock_levels:
          type: array
          items:
            $ref: '#/components/schemas/StockLevel'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/VariantTranslation'
        version:
          type: integer
          readOnly: true

    # -- Product (full representation) ---------------------------------------

    Product:
      type: object
      required: [id, status, options, variants, translations, channel_listings, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProductStatus'
        options:
          type: array
          description: Variation axes (e.g. Size, Colour). Empty for single-variant products.
          items:
            $ref: '#/components/schemas/Option'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Variant'
        assets:
          type: array
          description: Product-scoped assets (scope=product).
          items:
            $ref: '#/components/schemas/Asset'
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductTranslation'
        channel_listings:
          type: array
          items:
            $ref: '#/components/schemas/ChannelListing'
        marketplace_listings:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceListing'
        version:
          type: integer
          readOnly: true
          description: Optimistic lock version. Use as the value of the `If-Match` header on mutations.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # -- Write models --------------------------------------------------------

    CreateProductRequest:
      type: object
      required: [variants, translations]
      properties:
        options:
          type: array
          description: Omit for a single-variant product.
          items:
            $ref: '#/components/schemas/OptionInput'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantInput'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetInput'
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductTranslation'
        channel_listings:
          type: array
          items:
            $ref: '#/components/schemas/ChannelListing'
        marketplace_listings:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceListing'

    UpdateProductRequest:
      type: object
      description: |
        Full replacement of the product aggregate. All fields are re-evaluated.
        Omitted arrays (e.g. `marketplace_listings`) are left unchanged.
      properties:
        status:
          $ref: '#/components/schemas/ProductStatus'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionInput'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantInput'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetInput'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/ProductTranslation'
        channel_listings:
          type: array
          items:
            $ref: '#/components/schemas/ChannelListing'
        marketplace_listings:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceListing'

    PatchProductRequest:
      type: object
      description: |
        Partial update. Only provided fields are mutated.
        To remove all items from an array, pass an explicit empty array `[]`.
      properties:
        status:
          $ref: '#/components/schemas/ProductStatus'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/ProductTranslation'
        channel_listings:
          type: array
          items:
            $ref: '#/components/schemas/ChannelListing'
        marketplace_listings:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceListing'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantInput'

    OptionInput:
      type: object
      required: [code, sort_order, values, translations]
      properties:
        code:
          type: string
          example: size
        sort_order:
          type: integer
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OptionTranslation'
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OptionValueInput'

    OptionValueInput:
      type: object
      required: [code, sort_order, translations]
      properties:
        code:
          type: string
          example: xl
        sort_order:
          type: integer
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OptionValueTranslation'

    VariantInput:
      type: object
      required: [sku, price, currency, translations]
      properties:
        sku:
          type: string
          example: TSHIRT-S-RED
        price:
          type: number
          format: decimal
          example: 19.99
        currency:
          type: string
          example: GBP
        option_value_codes:
          type: array
          description: |
            Locale-neutral codes of the OptionValues that define this variant
            (e.g. `["s", "red"]`). Must reference codes declared in `options`.
          items:
            type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetInput'
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantTranslation'

    AssetInput:
      type: object
      required: [url, type, scope, sort_order]
      properties:
        url:
          type: string
          format: uri
        type:
          $ref: '#/components/schemas/AssetType'
        scope:
          $ref: '#/components/schemas/AssetScope'
        variant_sku:
          type: string
          description: Required when scope is `variant`. References a variant in the same request by SKU.
        sort_order:
          type: integer

    # -- Search result -------------------------------------------------------

    ProductSummary:
      type: object
      description: |
        Lightweight projection returned by the search context.
        Sourced from OpenSearch; reflects the locale and channel requested.
      required: [id, status, title, slug, variants]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProductStatus'
        title:
          type: string
          description: Localised title for the requested locale.
        slug:
          type: string
          description: Localised slug for the requested locale.
        short_description:
          type: string
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantSummary'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'

    VariantSummary:
      type: object
      required: [id, sku, price, currency, stock_level]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
        stock_level:
          $ref: '#/components/schemas/StockStatus'
        option_values:
          type: array
          description: Human-readable option value labels for the requested locale.
          items:
            type: object
            required: [option_code, option_name, value_code, value_label]
            properties:
              option_code:
                type: string
                example: size
              option_name:
                type: string
                example: Size
              value_code:
                type: string
                example: xl
              value_label:
                type: string
                example: Extra Large

    # -- Response envelopes --------------------------------------------------

    ProductResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/SingleMeta'
        links:
          type: array
          description: |
            HATEOAS links describing available actions on this resource.
            Clients should use these hrefs rather than constructing URLs manually.
          items:
            $ref: '#/components/schemas/Link'
          example:
            - method: GET
              href: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
              rel: self
            - method: PUT
              href: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
              rel: replace
            - method: PATCH
              href: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
              rel: update
            - method: DELETE
              href: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
              rel: delete
            - method: GET
              href: /catalog/search/v1
              rel: search

    SearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SingleMeta:
      type: object
      required: [version, etag]
      properties:
        version:
          type: integer
          description: Monotonic version counter incremented on every mutation.
          example: 4
        etag:
          type: string
          description: |
            Content-derived ETag generated by hashing the canonical JSON
            serialisation of the resource (SHA-256, hex-encoded, first 16 chars).
            Identical to the `ETag` response header. Use as the value of the
            `If-Match` header on subsequent mutations.
          example: '"a3f8c2d1e4b09712"'

    PaginationMeta:
      type: object
      required: [total]
      properties:
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Absent when no further results exist.
        total:
          type: integer
          description: Total number of matching documents in OpenSearch.

    # -- Command response (CQS: commands return links only) -----------------

    CommandResponse:
      type: object
      required: [links]
      description: |
        Returned by all mutating operations (POST, PUT, PATCH, DELETE).
        Contains no resource data — only HATEOAS links (CQS principle).
        Follow the `self` link to retrieve the updated resource.
      properties:
        links:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Link'
          example:
            - method: GET
              href: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
              rel: self
            - method: GET
              href: /catalog/search/v1
              rel: search

    # -- HATEOAS links -------------------------------------------------------

    LinkMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE]
      description: HTTP method for the link.

    LinkRel:
      type: string
      enum: [self, update, replace, delete, search]
      description: Relationship of the link to the current resource.

    Link:
      type: object
      required: [method, href, rel]
      properties:
        method:
          $ref: '#/components/schemas/LinkMethod'
        href:
          type: string
          description: Absolute path of the target endpoint.
          example: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
        rel:
          $ref: '#/components/schemas/LinkRel'

    # -- Errors --------------------------------------------------------------

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: PRODUCT_NOT_FOUND
            message:
              type: string
              example: product with id 123e4567-e89b-12d3-a456-426614174000 not found

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # --------------------------------------------------------------------------
  # catalog/product — PostgreSQL-backed CRUD
  # --------------------------------------------------------------------------

  /catalog/product/v1:
    post:
      operationId: createProduct
      summary: Create a product
      description: |
        Creates a new Product aggregate. Supply at least one variant and one
        translation. Optionally provide an `Idempotency-Key` header to make
        the request safe to retry.
      tags: [catalog/product]
      security:
        - oauth2: [catalog:product:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        "202":
          description: |
            Command accepted. The product will be created and events dispatched
            via the outbox. Follow the `self` link to retrieve the created resource.
          headers:
            ETag:
              description: Content-derived ETag of the created resource.
              schema:
                type: string
                example: '"a3f8c2d1e4b09712"'
            Location:
              description: Path of the created resource.
              schema:
                type: string
                example: /catalog/product/v1/123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /catalog/product/v1/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      operationId: getProduct
      summary: Get a product by ID
      description: |
        Returns the full Product aggregate. Served from Valkey cache (Bloom
        filter guards against requests for non-existent IDs).
      tags: [catalog/product]
      security:
        - oauth2: [catalog:product:read]
      parameters:
        - $ref: '#/components/parameters/LocaleParam'
        - $ref: '#/components/parameters/ChannelParam'
      responses:
        "200":
          description: Product found.
          headers:
            ETag:
              description: |
                Content-derived ETag. SHA-256 hash of the canonical JSON serialisation
                of the resource (first 16 hex chars). Changes whenever any field changes.
                Use as the `If-Match` value on PUT, PATCH, or DELETE.
              schema:
                type: string
                example: '"a3f8c2d1e4b09712"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "410":
          $ref: '#/components/responses/Gone'

    put:
      operationId: replaceProduct
      summary: Full update of a product
      description: |
        Replaces the entire Product aggregate. Requires `If-Match` containing
        the current ETag. Returns `412` if the ETag is stale.
        Returns `202 Accepted` with links only (CQS — no resource body on commands).
      tags: [catalog/product]
      security:
        - oauth2: [catalog:product:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        "202":
          description: |
            Command accepted. Follow the `self` link to retrieve the updated resource.
          headers:
            ETag:
              description: New content-derived ETag. Use as `If-Match` for the next mutation.
              schema:
                type: string
                example: '"c91a4f2b8e3d0561"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "410":
          $ref: '#/components/responses/Gone'
        "412":
          $ref: '#/components/responses/VersionConflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    patch:
      operationId: updateProduct
      summary: Partial update of a product
      description: |
        Applies a partial mutation to the Product aggregate. Only provided
        fields are changed. Requires `If-Match`.
        Returns `202 Accepted` with links only (CQS — no resource body on commands).
      tags: [catalog/product]
      security:
        - oauth2: [catalog:product:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProductRequest'
      responses:
        "202":
          description: |
            Command accepted. Follow the `self` link to retrieve the updated resource.
          headers:
            ETag:
              description: New content-derived ETag. Use as `If-Match` for the next mutation.
              schema:
                type: string
                example: '"c91a4f2b8e3d0561"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "410":
          $ref: '#/components/responses/Gone'
        "412":
          $ref: '#/components/responses/VersionConflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteProduct
      summary: Soft delete a product
      description: |
        Marks the product as deleted. Retained in the database but removed
        from the OpenSearch index. Requires `If-Match`.
        Returns `202 Accepted` with links only (CQS — no resource body on commands).
      tags: [catalog/product]
      security:
        - oauth2: [catalog:product:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        "202":
          description: |
            Command accepted. The product will be soft-deleted and removed from
            the search index. Follow the `search` link to continue browsing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "410":
          $ref: '#/components/responses/Gone'
        "412":
          $ref: '#/components/responses/VersionConflict'

  # --------------------------------------------------------------------------
  # catalog/search — OpenSearch-backed read-only search
  # --------------------------------------------------------------------------

  /catalog/search/v1:
    get:
      operationId: searchProducts
      summary: Search and list products
      description: |
        Searches the OpenSearch index. Supports full-text search, faceted
        filtering, and cursor-based pagination. Results are locale- and
        channel-aware projections; only `published` products with at least
        one non-OOS variant are returned.
      tags: [catalog/search]
      security:
        - oauth2: [catalog:search:read]
      parameters:
        - $ref: '#/components/parameters/LocaleParam'
        - $ref: '#/components/parameters/ChannelParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          required: false
          description: Full-text search query.
          schema:
            type: string
            example: classic t-shirt
        - name: category
          in: query
          required: false
          description: Filter by category code.
          schema:
            type: string
            example: tops
        - name: min_price
          in: query
          required: false
          description: Minimum variant price (inclusive).
          schema:
            type: number
            format: decimal
            example: 10.00
        - name: max_price
          in: query
          required: false
          description: Maximum variant price (inclusive).
          schema:
            type: number
            format: decimal
            example: 50.00
        - name: stock_status
          in: query
          required: false
          description: Filter by stock status. Defaults to excluding OOS variants.
          schema:
            $ref: '#/components/schemas/StockStatus'
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        "400":
          $ref: '#/components/responses/BadRequest'

  # --------------------------------------------------------------------------
  # Health probes
  # --------------------------------------------------------------------------

  /healthz:
    get:
      operationId: healthLiveness
      summary: Liveness probe
      description: Returns 200 if the process is alive. Used by Kubernetes / ECS.
      tags: [health]
      security: []
      responses:
        "200":
          description: Alive.

  /readyz:
    get:
      operationId: healthReadiness
      summary: Readiness probe
      description: |
        Returns 200 when the service is ready to serve traffic (database
        connection pool healthy, Valkey reachable, Bloom filter loaded).
      tags: [health]
      security: []
      responses:
        "200":
          description: Ready.
        "503":
          description: Not ready.
